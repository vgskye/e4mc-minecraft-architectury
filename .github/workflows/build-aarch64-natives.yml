name: Build aarch64 native library

on:
  push:
    branches: [rererewrite]
  workflow_dispatch:

jobs:
  build-aarch64:
    runs-on: ubuntu-latest
    name: Build libnetty_quiche.so for aarch64
    steps:
      - name: Checkout netty-incubator-codec-quic
        uses: actions/checkout@v4
        with:
          repository: netty/netty-incubator-codec-quic
          ref: main
          path: netty-quic

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: aarch64-native-maven-${{ hashFiles('netty-quic/**/pom.xml') }}
          restore-keys: |
            aarch64-native-maven-

      - name: Build Docker cross-compile image
        working-directory: netty-quic
        run: |
          docker compose -f docker/docker-compose.centos-7-cross.yaml build

      - name: Cross-compile native library for aarch64
        working-directory: netty-quic
        run: |
          docker compose -f docker/docker-compose.centos-7-cross.yaml run cross-compile-aarch64-build

      - name: Find and rename the native library
        run: |
          mkdir -p native-libs
          find netty-quic -name "libnetty_quiche_linux_aarch_64.so" -exec cp {} native-libs/libnetty_quiche_linux_aarch_64.so \;
          ls -la native-libs/

      - name: Upload native library artifact
        uses: actions/upload-artifact@v4
        with:
          name: libnetty_quiche-linux-aarch64
          path: native-libs/libnetty_quiche_linux_aarch_64.so
          retention-days: 90

  build-aarch64-android:
    runs-on: ubuntu-latest
    name: Build libnetty_quiche.so for aarch64 Android
    env:
      SDK_VER: "android-21"
      NDK_VER: "25.2.9519653"
    steps:
      - name: Checkout netty-incubator-codec-quic
        uses: actions/checkout@v4
        with:
          repository: netty/netty-incubator-codec-quic
          ref: main
          path: netty-quic

      - name: Install ninja-build
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install cargo-ndk
        uses: actions-rs/install@v0.1
        with:
          crate: cargo-ndk

      - name: Install Rust toolchain for Android
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 8512546

      - name: Install Android SDK platforms
        run: sdkmanager "platforms;${{ env.SDK_VER }}"

      - name: Install Android NDK
        run: sdkmanager "ndk;${{ env.NDK_VER }}"

      - name: Set ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VER }}" >> $GITHUB_ENV

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: android-native-maven-${{ hashFiles('netty-quic/**/pom.xml') }}
          restore-keys: |
            android-native-maven-

      - name: Build Android aarch64 native library
        working-directory: netty-quic
        run: ./mvnw -B -ntp --file pom.xml clean package -Dandroid -Pandroid-arm64-v8a

      - name: Find and copy the Android native library
        run: |
          mkdir -p native-libs
          find netty-quic -name "libnetty_quiche.so" -path "*/arm64-v8a/*" -exec cp {} native-libs/libnetty_quiche_aarch64_android.so \;
          ls -la native-libs/

      - name: Upload Android native library artifact
        uses: actions/upload-artifact@v4
        with:
          name: libnetty_quiche-android-aarch64
          path: native-libs/libnetty_quiche_aarch64_android.so
          retention-days: 90
