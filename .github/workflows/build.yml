name: Build

on:
  push:
    branches: [rererewrite]
  workflow_dispatch:

jobs:
  # ── Native libraries ──────────────────────────────────────────────
  build-aarch64:
    runs-on: ubuntu-latest
    name: Native - Linux aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          repository: netty/netty-incubator-codec-quic
          ref: main
          path: netty-quic

      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: 8 }

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: aarch64-native-maven-${{ hashFiles('netty-quic/**/pom.xml') }}
          restore-keys: aarch64-native-maven-

      - name: Build & cross-compile
        working-directory: netty-quic
        run: |
          # Wandisco repo is dead; remove it from Dockerfile
          sed -i '/wandisco/d' docker/Dockerfile.cross_compile_aarch64
          docker compose -f docker/docker-compose.centos-7-cross.yaml build
          docker compose -f docker/docker-compose.centos-7-cross.yaml run cross-compile-aarch64-build

      - name: Collect .so
        run: |
          mkdir -p native-libs
          find netty-quic -name "libnetty_quiche_linux_aarch_64.so" \
            -exec cp {} native-libs/libnetty_quiche_linux_aarch_64.so \;
          ls -lh native-libs/

      - uses: actions/upload-artifact@v4
        with:
          name: libnetty_quiche-linux-aarch64
          path: native-libs/libnetty_quiche_linux_aarch_64.so
          retention-days: 90

  build-aarch64-android:
    runs-on: ubuntu-latest
    name: Native - Android aarch64
    env:
      SDK_VER: android-21
      NDK_VER: 25.2.9519653
    steps:
      - uses: actions/checkout@v4
        with:
          repository: netty/netty-incubator-codec-quic
          ref: main
          path: netty-quic

      - run: sudo apt-get update && sudo apt-get install -y ninja-build

      - uses: actions/setup-go@v5
        with: { go-version: '1.21' }

      - uses: actions-rs/install@v0.1
        with: { crate: cargo-ndk }

      - run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: 8 }

      - uses: android-actions/setup-android@v3
        with: { cmdline-tools-version: 8512546 }

      - run: sdkmanager "platforms;${{ env.SDK_VER }}"
      - run: sdkmanager "ndk;${{ env.NDK_VER }}"
      - run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VER }}" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: android-native-maven-${{ hashFiles('netty-quic/**/pom.xml') }}
          restore-keys: android-native-maven-

      - name: Build native library
        working-directory: netty-quic
        run: |
          ./mvnw -B -ntp install -DskipTests -pl codec-classes-quic -am
          ./mvnw -B -ntp install -DskipTests -Dandroid -Pandroid-arm64-v8a -pl codec-native-quic

      - name: Collect .so
        run: |
          mkdir -p native-libs
          find netty-quic -path "*/arm64-v8a/*" -name "libnetty_quiche*.so" \
            -exec cp {} native-libs/libnetty_quiche_aarch64_android.so \;
          ls -lh native-libs/

      - uses: actions/upload-artifact@v4
        with:
          name: libnetty_quiche-android-aarch64
          path: native-libs/libnetty_quiche_aarch64_android.so
          retention-days: 90

  # ── Mod JAR ───────────────────────────────────────────────────────
  build-mod:
    runs-on: ubuntu-latest
    name: Mod - Fabric JAR
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: 21 }

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build Fabric mod
        run: |
          chmod +x gradlew
          ./gradlew fabric:build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: e4mc-fabric
          path: fabric/build/libs/*.jar
          retention-days: 90
